<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Usermod</title>
  <style>
    body { font-family: sans-serif; margin: 2em; background: #111; color: #eee; }
    h1 { color: #5b9bd5; }
    #out { font-family: monospace; white-space: pre; }
    button { padding: .5em 1em; }
  </style>
</head>
<body>
  <h1>Example Usermod</h1>
  <p>Served from a header generated by <code>tools/cdata.js</code> out of this
     usermod's <code>cdata.json</code> manifest. Built on WLED ##VERSION##.</p>
  <button onclick="refresh()">Refresh</button>
  <div id="out">loading&hellip;</div>
  <script>
    function refresh() {
      fetch("/example/data")
        .then(r => r.json())
        .then(j => { document.getElementById("out").textContent = JSON.stringify(j, null, 2); })
        .catch(e => { document.getElementById("out").textContent = "error: " + e; });
    }
    refresh();
  </script>
</body>
</html>
